<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landscape</title>
    <style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#dcdcdc;
    font-family:Arial, Helvetica, sans-serif;
}


.frame{
    width:700px;
    height:450px;
    border:12px solid #654321;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 10px 25px rgba(0,0,0,.3);
}


.sky{
    position:relative;
    width:100%;
    height:100%;
    background:linear-gradient(to bottom,#7ec8ff,#cceeff);
    overflow:hidden;
}


.sun{
    position:absolute;
    top:25px;
    left:25px;
    width:90px;
    height:90px;
    background:#FFD93D;
    border-radius:50%;
    box-shadow:
        0 0 20px #FFD93D,
        0 0 40px #FFD93D,
        0 0 70px rgba(255,217,61,.7);
}


.hill{
    position:absolute;
    bottom:-120px;
    border-radius:50%;
}


.hill-back{
    width:500px;
    height:300px;
    left:-40px;
    background:#4CAF50;
}


.hill-front{
    width:600px;
    height:330px;
    right:-80px;
    background:#2E8B57;
}
</style>
</head>
<body>

<div class="frame">
    <div class="sky">
        <div class="sun"></div>

        <div class="hill hill-back"></div>
        <div class="hill hill-front"></div>
    </div>
</div>

</body>
</html>
