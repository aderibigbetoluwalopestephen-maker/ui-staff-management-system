<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3×3 Grid</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#e8e8e8;
    font-family:Arial, Helvetica, sans-serif;
}

/* Outer Container */
.wrapper{
    border:4px solid #000;
    padding:20px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

/* Grid */
.container{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:8px;
}


.cell{
    border:4px solid rgba(0,0,0,.8);
    background:lightblue;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    border-radius:8px;
}






.wrapper{
    position:relative;
    border:4px solid #000;
    padding:20px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

.outside{
    position:absolute;
    right:-120px;   
    top:50%;
    transform:translateY(-50%);
    width:100px;
    height:100px;
}
.wrapper{
    position:relative;
    border:4px solid #000;
    padding:20px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}

 
.cell5{
    position: relative;
    left: -110px;
    top: -130px;
}

</style>

</head>
<body>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Move Box 5 Outside</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    background:#e8e8e8;
    font-family:Arial, Helvetica, sans-serif;
}


.wrapper{
    position:relative;
    border:4px solid #000;
    padding:20px;
    border-radius:12px;
    background:#fff;
    box-shadow:0 8px 20px rgba(0,0,0,.2);
}


.container{
    display:grid;
    grid-template-columns:repeat(3,100px);
    grid-template-rows:repeat(3,100px);
    gap:8px;
}


.cell{
    width:100px;
    height:100px;
    border:4px solid rgba(0,0,0,.8);
    background:lightblue;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
    border-radius:8px;
}


.empty{
    width:100px;
    height:100px;
}


.outside{
    position:absolute;
    right:-770px;
    top:50%;
    transform:translateY(-50%);
    width:100px;
    height:100px;
    background:lightblue;
}
</style>
</head>
<body>

<div class="wrapper">

    <div class="container">
        <div class="cell">1</div>
        <div class="cell">2</div>
        <div class="cell">3</div>

        <div class="cell">4</div>
        <div class="empty"></div> 
        <div class="cell">6</div>

        <div class="cell">7</div>
        <div class="cell">8</div>
        <div class="cell">9</div>
    </div>

    
    <div class="cell outside">5</div>

</div>

</body>
